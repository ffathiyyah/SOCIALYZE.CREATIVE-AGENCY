{% load static %}<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Login — Socialyze</title><link rel="stylesheet" href="{% static 'website/style.css' %}"></head><body class="admin-page"><header class="site-header"><a class="brand" href="{% url 'home' %}"><img src="{% static 'website/images/logo.png' %}" alt=""><span class="brand-copy"><strong>SOCIALYZE</strong><small>ADMIN ACCESS</small></span></a><a class="button button-dark" href="{% url 'home' %}">← Kembali ke website</a></header><main class="admin-wrap"><section class="admin-login"><p class="eyebrow">PRIVATE AREA / DJANGO AUTH</p><h1>Admin <em>dashboard.</em></h1><p>Masuk menggunakan akun staff Django.</p>{% if error %}<p class="login-error">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="button button-dark full-width" type="submit">Masuk dashboard ↗</button></form><small>Akun dibuat melalui <code>python manage.py createsuperuser</code>.</small></section></main></body></html>
