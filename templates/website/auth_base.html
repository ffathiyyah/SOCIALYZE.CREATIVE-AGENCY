{% load static %}<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ page_title|default:'Akun Socialyze' }}</title><link rel="stylesheet" href="{% static 'website/style.css' %}"><style>
.auth-wrap{min-height:100vh;background:#fff8ca;color:#430709;display:grid;place-items:center;padding:28px 16px;font-family:Arial,sans-serif}.auth-card{width:min(100%,560px);background:#fffdf0;border:1px solid #e7dfb9;border-radius:24px;padding:clamp(24px,5vw,42px);box-shadow:0 22px 70px #43070918}.auth-card h1{font-size:clamp(30px,5vw,42px);margin:8px 0 12px}.auth-card p{line-height:1.6}.auth-card label{display:block;font-weight:600;margin:14px 0 6px}.auth-card input{display:block;width:100%;box-sizing:border-box;padding:12px 14px;border:1px solid #d9cfa6;border-radius:10px;background:white;color:#291b14}.auth-card ul.errorlist{color:#9b2020;font-size:14px}.auth-card .helptext{display:block;font-size:12px;color:#645b47;margin-top:5px}.auth-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.auth-actions button,.auth-actions a,.auth-link{border:0;border-radius:999px;background:#430709;color:#fff8ca;padding:12px 18px;text-decoration:none;cursor:pointer}.auth-link{display:inline-block;margin-top:10px}.auth-msg{background:#edf3cb;padding:10px 12px;border-radius:8px;margin:10px 0}.auth-error{color:#a51e1e}.auth-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px}.auth-nav a{color:#430709}.auth-table{width:100%;border-collapse:collapse;margin-top:18px}.auth-table th,.auth-table td{text-align:left;padding:10px;border-bottom:1px solid #e7dfb9;font-size:14px}.auth-table-wrap{overflow-x:auto}.field-errors{color:#9b2020;font-size:13px}
</style></head><body><main class="auth-wrap"><section class="auth-card"><div class="auth-nav"><a href="{% url 'home' %}">← Socialyze</a>{% if request.user.is_authenticated %}<form method="post" action="{% url 'staff_logout' %}">{% csrf_token %}<button type="submit" class="auth-link">Logout</button></form>{% endif %}</div>{% if messages %}{% for message in messages %}<div class="auth-msg">{{ message }}</div>{% endfor %}{% endif %}{% block content %}{% endblock %}</section></main></body></html>
